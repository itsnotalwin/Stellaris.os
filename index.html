%12;let gi3=this.perm[ii+1+this.perm[jj+1+this.perm[kk+1]]]%12;let t0=0.6-x0*x0-y0*y0-z0*z0;if(t0<0)n0=0;else{t0*=t0;n0=t0*t0*this.dot(this.grad3[gi0],x0,y0,z0)}let t1=0.6-x1*x1-y1*y1-z1*z1;if(t1<0)n1=0;else{t1*=t1;n1=t1*t1*this.dot(this.grad3[gi1],x1,y1,z1)}let t2=0.6-x2*x2-y2*y2-z2*z2;if(t2<0)n2=0;else{t2*=t2;n2=t2*t2*this.dot(this.grad3[gi2],x2,y2,z2)}let t3=0.6-x3*x3-y3*y3-z3*z3;if(t3<0)n3=0;else{t3*=t3;n3=t3*t3*this.dot(this.grad3[gi3],x3,y3,z3)}return 32*(n0+n1+n2+n3)}}

  function getTimeOfDayColor() {
    const now = new Date();
    const hour = now.getHours() + now.getMinutes() / 60;
    const night = [8, 6, 28];
    const dawn = [18, 14, 48];
    const day = [12, 18, 42];
    const dusk = [16, 10, 38];
    let color;
    if (hour >= 0 && hour < 5) {
      color = night;
    } else if (hour < 8) {
      let t = (hour - 5) / 3;
      color = night.map((c, i) => Math.round(c + (dawn[i] - c) * t));
    } else if (hour < 19) {
      color = day;
    } else if (hour < 22) {
      let t = (hour - 19) / 3;
      color = day.map((c, i) => Math.round(c + (dusk[i] - c) * t));
    } else {
      let t = (hour - 22) / 2;
      color = dusk.map((c, i) => Math.round(c + (night[i] - c) * t));
    }
    return `rgb(${color[0]},${color[1]},${color[2]})`;
  }

  function saveStarPositions(){let positions={};for(let star of[...notes,...tempStars]){positions[star.id]={x:star.x,y:star.y,vx:star.vx,vy:star.vy};}localStorage.setItem('stellaris_starPositions',JSON.stringify(positions));if(db&&navigator.onLine){let batch=db.batch();for(let star of[...notes,...tempStars]){batch.set(db.collection('starPositions').doc(star.id),{x:star.x,y:star.y,vx:star.vx,vy:star.vy,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}batch.commit().catch(()=>{});}}

  function simulate(nowSec){

          note.vx=(note.vx||0)+Math.cos(fa)*0.006;
          note.vy=(note.vy||0)+Math.sin(fa)*0.006;
        }else{
          note.vx+=(Math.random()-0.5)*0.015;

    requestAnimationFrame(animateLoop);
  }

  if(!localPeerName){
    document.getElementById('nameModal').style.display='flex';requestAnimationFrame(()=>document.getElementById('nameModal').classList.add('visible'));
    document.getElementById('saveNameBtn').onclick=()=>{let name=document.getElementById('nameInput').value.trim();if(!name)name='stargazer';startApp(name);};
  }else initApp();
})();
</script>

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registered! Scope:', reg.scope))
      .catch(err => console.error('Service Worker registration failed:', err));
  });
}
